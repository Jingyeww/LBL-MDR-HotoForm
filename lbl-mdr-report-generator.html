<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layer by Layer — MDR Service Report</title>
<style>
  :root{
    --green:#A5CD67;
    --green-deep:#6E9B33;
    --green-wash:#F1F7E8;
    --ink:#2B2E31;
    --ink-2:#54595F;
    --muted:#8A9099;
    --bench:#F2F3F0;
    --bench-2:#E7E9E3;
    --rule:#D9DCD6;
    --paper:#ffffff;
    --ok:#5E8F2A;
    --warn:#8A9099;
    --bad:#2B2E31;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --doc:Georgia,"Iowan Old Style","Times New Roman",serif;
    --cond:"Arial Narrow","Helvetica Neue Condensed",Impact,var(--ui);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--ui);
    color:var(--ink);
    background:var(--bench);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit}
  input,select,textarea{font:inherit;color:inherit}

  /* ---------- app chrome ---------- */
  .bar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;gap:14px;
    background:#fff;color:var(--ink);
    padding:9px 18px;
    border-bottom:3px solid var(--green);
    box-shadow:0 1px 6px rgba(43,46,49,.06);
  }
  .bar img{height:30px;width:auto;flex:none}
  .bar h1{
    font-family:var(--cond);
    font-size:19px;letter-spacing:.06em;font-weight:700;
    margin:0;text-transform:uppercase;
  }
  .bar .sub{color:var(--muted);font-size:13px;margin-right:auto}
  .bar button{
    background:#fff;color:var(--ink);
    border:1px solid var(--rule);border-radius:3px;
    padding:7px 12px;cursor:pointer;
  }
  .bar button:hover{background:var(--bench)}
  .bar button.primary{background:var(--green);color:#20260F;border-color:var(--green-deep);font-weight:600}
  .bar button.primary:hover{background:#b3d97b}
  .bar button:focus-visible,.pane button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-within{outline:2px solid var(--green-deep);outline-offset:2px}

  .layout{display:grid;grid-template-columns:minmax(380px,460px) 1fr;gap:0;align-items:start}

  /* ---------- form pane ---------- */
  .pane{padding:18px 20px 80px;background:var(--bench);border-right:1px solid var(--rule)}
  .stage{margin:0 0 22px}
  .stage > h2{
    display:flex;align-items:baseline;gap:9px;
    font-size:14px;font-weight:700;margin:0 0 9px;
    padding-bottom:6px;border-bottom:1px solid var(--rule);
  }
  .stage > h2 .n{
    font-family:var(--cond);font-size:13px;color:#20260F;background:var(--green);
    width:19px;height:19px;border-radius:2px;
    display:inline-flex;align-items:center;justify-content:center;
    flex:none;transform:translateY(-1px);
  }
  .stage > h2 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .grid.one{grid-template-columns:1fr}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
  label.f input,label.f select,label.f textarea{
    background:#fff;border:1px solid var(--rule);border-radius:3px;
    padding:7px 8px;font-size:14px;color:var(--ink);width:100%;
  }
  label.f textarea{min-height:64px;resize:vertical;line-height:1.4}
  .span2{grid-column:1/-1}

  .group{margin:10px 0 4px}
  .group h3{font-size:12px;color:var(--ink-2);font-weight:600;margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--rule);border-radius:14px;
    padding:4px 11px 4px 8px;font-size:13px;cursor:pointer;user-select:none;
  }
  .chip:hover{border-color:var(--green-deep)}
  .chip input{accent-color:var(--green-deep);margin:0}
  .chip:has(input:checked){background:var(--green);color:#20260F;border-color:var(--green-deep)}
  .chip.custom:has(input:checked){background:var(--green-wash);color:var(--ink);border-color:var(--green)}
  .chip .x{color:var(--ink-2);padding-left:2px}
  .chip .x:hover{color:var(--bad)}
  .addrow{display:flex;gap:6px;margin-top:8px}
  .addrow input{flex:1;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:6px 8px;font-size:13px}
  .addrow button,.mini{
    background:#fff;border:1px solid var(--rule);border-radius:3px;
    padding:6px 11px;cursor:pointer;font-size:13px;
  }
  .addrow button:hover,.mini:hover{background:var(--bench-2)}

  table.parts{width:100%;border-collapse:collapse;font-size:13px}
  table.parts th{text-align:left;font-size:11px;color:var(--ink-2);font-weight:600;padding:0 4px 4px}
  table.parts td{padding:2px}
  table.parts input{width:100%;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:6px}
  table.parts td.k{width:52px}
  table.parts td.p{width:78px}
  table.parts td.d{width:26px}
  table.parts button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
  table.parts button:hover{color:var(--bad)}

  .fixedline{
    background:var(--green-wash);border:1px solid var(--green);border-radius:3px;
    padding:9px 11px;font-size:13px;line-height:1.5;
  }
  .fixedline b{display:block}
  .fixedline span{color:var(--ink-2);font-size:12.5px}

  .toggle{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:10px;cursor:pointer}

  /* ---------- report ---------- */
  .preview{padding:22px;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow:auto}
  .sheet{
    background:var(--paper);color:var(--ink);
    width:100%;max-width:760px;margin:0 auto;
    box-shadow:0 1px 2px rgba(43,46,49,.14),0 10px 30px rgba(43,46,49,.09);
    font-family:var(--doc);font-size:13.5px;line-height:1.55;
  }
  .sheet .band{
    padding:26px 26px 14px;
    display:flex;gap:22px;align-items:flex-start;
  }
  .band img.logo{height:78px;width:auto;flex:none}
  .band .shop{flex:1;min-width:0;padding-top:6px}
  .band .shop .name{font-family:var(--ui);font-size:15px;font-weight:600;letter-spacing:.01em}
  .band .shop .meta{font-size:11.5px;color:var(--ink-2);margin-top:4px;font-family:var(--ui);line-height:1.5}
  .band .ref{text-align:right;font-family:var(--ui);flex:none}
  .band .ref .t{font-size:10.5px;letter-spacing:.12em;color:var(--green-deep);font-weight:700}
  .band .ref .no{font-family:var(--cond);font-size:21px;font-weight:700;letter-spacing:.04em;line-height:1.2}
  .band .ref .dt{font-size:11.5px;color:var(--ink-2)}

  /* three stacked rules — the layers of the mark */
  .layers{margin:0 26px}
  .layers i{display:block}
  .layers i:nth-child(1){height:4px;background:var(--green)}
  .layers i:nth-child(2){height:2px;background:var(--rule);margin-top:2px}
  .layers i:nth-child(3){height:1px;background:var(--bench-2);margin-top:2px}

  .stampwrap{padding:12px 26px 0;display:flex;justify-content:flex-end}
  .stamp{
    font-family:var(--cond);text-transform:uppercase;letter-spacing:.09em;
    font-size:15px;font-weight:700;padding:5px 14px;
    border:2.5px solid currentColor;border-radius:3px;transform:rotate(-2.5deg);
  }
  .stamp.ok{color:var(--ok)} .stamp.warn{color:var(--warn)} .stamp.bad{color:var(--bad)}

  .sheet .body{padding:6px 26px 26px}
  .facts{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;margin:10px 0 6px}
  .facts .box{border-top:2px solid var(--ink);padding-top:7px}
  .facts .box h4{font-family:var(--ui);font-size:10.5px;letter-spacing:.1em;color:var(--ink-2);margin:0 0 5px;font-weight:700}
  .facts dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:12.5px}
  .facts dt{color:var(--muted);font-family:var(--ui);font-size:11.5px}
  .facts dd{margin:0}

  .sec{margin-top:16px;page-break-inside:avoid}
  .sec h3{
    font-family:var(--ui);font-size:12px;font-weight:700;margin:0 0 6px;
    padding-bottom:3px;border-bottom:1px solid var(--rule);
    display:flex;gap:8px;align-items:baseline;
  }
  .sec h3 .n{color:var(--green-deep);font-family:var(--cond);font-size:13px}
  .sec ul{margin:0;padding-left:17px}
  .sec li{margin:1px 0}
  .sec li::marker{color:var(--green-deep)}
  .sec p{margin:6px 0 0}
  .sec p.note{color:var(--ink-2)}
  .empty{color:var(--muted);font-style:italic}

  table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
  table.tbl th{font-family:var(--ui);font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);text-align:left;border-bottom:1px solid var(--rule);padding:4px 6px}
  table.tbl td{padding:4px 6px;border-bottom:1px solid var(--bench-2)}
  table.tbl .r{text-align:right;white-space:nowrap}
  table.tbl tr.total td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;padding-top:6px}

  .signrow{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px;page-break-inside:avoid}
  .signrow .sig{border-top:1px solid var(--ink);padding-top:5px;font-size:11.5px;font-family:var(--ui);color:var(--ink-2)}
  .signrow .sig b{display:block;color:var(--ink);font-size:13px;font-family:var(--doc);font-weight:400;min-height:18px}
  .terms{margin-top:20px;border-top:1px solid var(--rule);padding-top:8px;font-size:10.5px;color:var(--ink-2);font-family:var(--ui);line-height:1.5}

  /* ---------- saved jobs ---------- */
  dialog{border:1px solid var(--rule);border-radius:4px;padding:0;max-width:520px;width:92vw;background:#fff}
  dialog::backdrop{background:rgba(43,46,49,.42)}
  dialog header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}
  dialog header h2{margin:0;font-size:15px;flex:1}
  dialog .list{max-height:52vh;overflow:auto;padding:6px 0}
  dialog .row{display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--bench)}
  dialog .row .t{flex:1;min-width:0;font-size:13px}
  dialog .row .t span{display:block;color:var(--muted);font-size:11.5px}
  dialog footer{padding:10px 16px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--rule)}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:3px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .18s;z-index:60;
  }
  .toast.show{opacity:1}
  .mobiletabs{display:none}

  @media (max-width:960px){
    .layout{grid-template-columns:1fr}
    .pane{border-right:0;border-bottom:1px solid var(--rule)}
    .preview{position:static;max-height:none;padding:14px}
    .mobiletabs{display:flex;gap:6px;padding:10px 20px 0}
    .mobiletabs button{flex:1;padding:8px;border:1px solid var(--rule);background:#fff;border-radius:3px;cursor:pointer}
    .mobiletabs button[aria-pressed="true"]{background:var(--green);color:#20260F;border-color:var(--green-deep)}
    body.show-preview .pane{display:none}
    body.show-form .preview{display:none}
    .facts,.signrow{grid-template-columns:1fr;gap:12px}
    .bar .sub{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------- print ---------- */
  @page{size:A4;margin:12mm}
  @media print{
    body{background:#fff}
    .bar,.pane,.mobiletabs,.toast,dialog{display:none!important}
    .layout{display:block}
    .preview{position:static;padding:0;max-height:none;overflow:visible}
    .sheet{box-shadow:none;max-width:none;font-size:11.5pt}
    .sheet .band{padding:0 0 10px}
    .layers{margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .sheet .body,.stampwrap{padding-left:0;padding-right:0}
  }
</style>
</head>
<body class="show-form">

<div class="bar">
  <img id="barLogo" alt="Layer by Layer">
  <h1>Service report</h1>
  <span class="sub">Maintenance, diagnosis &amp; repair</span>
  <button id="btnNew">New job</button>
  <button id="btnSaved">Saved jobs</button>
  <button id="btnSave">Save job</button>
  <button id="btnPrint">Print</button>
  <button id="btnPdf" class="primary">Download PDF</button>
</div>

<div class="mobiletabs">
  <button id="tabForm" aria-pressed="true">Job entry</button>
  <button id="tabPrev" aria-pressed="false">Report</button>
</div>

<div class="layout">
  <section class="pane" id="pane"></section>
  <section class="preview"><div class="sheet" id="sheet"></div></section>
</div>

<dialog id="dlg">
  <header><h2>Saved jobs</h2><button class="mini" id="dlgClose">Close</button></header>
  <div class="list" id="dlgList"></div>
  <footer>Jobs are stored with this app. Loading a job replaces what's currently in the form.</footer>
</dialog>

<div class="toast" id="toast"></div>

const STORE_KEY = "mdr-data-v1";
let store = { shop:{}, jobs:[], seq:1 };

let mem = null; // in-memory fallback if storage is unavailable

function blank(){
  return {
    id:null,
    shop:{ name:SHOP_NAME, contact:SHOP_CONTACT, tech:"" },
    job:{ ref:"", date:today(), status:"Resolved", currency:"$", showCharges:true,
          labourHours:"", labourRate:"", terms:DEFAULT_TERMS },
    cust:{ name:"", phone:"", email:"", intake:"" },

    symptoms:[], symptomsCustom:[], symptomNotes:"",

    work:DEFAULT_WORK.slice(), workCustom:[], workNotes:"",

    verify:DEFAULT_VERIFY.slice(), verifyCustom:[], verifyNotes:"",

function today(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return String(n).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }
function money(n,cur){ return cur+" "+(Math.round(n*100)/100).toFixed(2); }

/* ---------- storage ---------- */
async function loadStore(){
  try{
    const r = await window.storage.get(STORE_KEY);
    if(r && r.value) store = JSON.parse(r.value);
  }catch(e){
    // no saved data yet, or storage unavailable in this environment
    if(mem) store = mem;
  }
  if(!store.jobs) store.jobs = [];
  if(!store.seq)  store.seq = 1;
  if(!store.shop) store.shop = {};
}
async function saveStore(){
  mem = store;
  try{
    const r = await window.storage.set(STORE_KEY, JSON.stringify(store));
    return !!r;
  }catch(e){ return false; }
}

/* ---------- form ---------- */
function chipGroup(dict, key, customKey){
  let h = "";
  for(const [heading, items] of Object.entries(dict)){
    h += '<div class="group"><h3>'+esc(heading)+'</h3><div class="chips">';
    for(const it of items){
      const on = state[key].includes(it);
      h += '<label class="chip"><input type="checkbox" data-multi="'+key+'" value="'+esc(it)+'"'+(on?" checked":"")+'>'+esc(it)+'</label>';
    }
    h += '</div></div>';
  }
  h += customList(key, customKey);
  return h;
}
function flatChips(items, key, customKey){
  let h = '<div class="chips">';
  for(const it of items){
    const on = state[key].includes(it);
    h += '<label class="chip"><input type="checkbox" data-multi="'+key+'" value="'+esc(it)+'"'+(on?" checked":"")+'>'+esc(it)+'</label>';
  }
  h += '</div>' + customList(key, customKey);
  return h;
}
function customList(key, customKey){
  let h = "";
  if(state[customKey].length){
    h += '<div class="chips" style="margin-top:8px">';
    state[customKey].forEach((it,i)=>{
      h += '<label class="chip custom"><input type="checkbox" checked disabled>'+esc(it)+
           '<span class="x" data-delcustom="'+customKey+'" data-i="'+i+'" role="button" tabindex="0" title="Remove">&times;</span></label>';
    });
    h += '</div>';
  }
  h += '<div class="addrow"><input type="text" placeholder="Add your own item" data-addinput="'+customKey+'">'+
       '<button type="button" data-addbtn="'+customKey+'">Add</button></div>';
  return h;
}
function field(path, label, opts){
  opts = opts || {};
  const v = get(path);
  const cls = opts.span ? " span2" : "";
  if(opts.type === "textarea")
    return '<label class="f'+cls+'">'+esc(label)+'<textarea data-f="'+path+'" placeholder="'+esc(opts.ph||"")+'">'+esc(v)+'</textarea></label>';
  if(opts.options){
    let o = "";
    for(const x of opts.options){
      const val = Array.isArray(x)?x[0]:x;
      o += '<option'+(val===v?" selected":"")+'>'+esc(val)+'</option>';
    }
    return '<label class="f'+cls+'">'+esc(label)+'<select data-f="'+path+'">'+o+'</select></label>';
  }
  return '<label class="f'+cls+'">'+esc(label)+'<input type="'+(opts.type||"text")+'" data-f="'+path+'" placeholder="'+esc(opts.ph||"")+'" value="'+esc(v)+'"></label>';
}
function get(path){ return path.split(".").reduce((o,k)=>(o||{})[k], state); }
function set(path,val){
  const ks = path.split("."); const last = ks.pop();
  ks.reduce((o,k)=>o[k], state)[last] = val;
}

/* ---------- report ---------- */

  const all = items.concat(custom||[]);
  if(!all.length) return '<p class="empty">None recorded.</p>';
  return "<ul>"+all.map(i=>"<li>"+esc(i)+"</li>").join("")+"</ul>";
}

  const partsTotal = partRows.reduce((t,p)=>t+(parseFloat(p.qty)||0)*(parseFloat(p.price)||0),0);
  const dateStr = s.job.date ? new Date(s.job.date+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}) : "";

  let charges = "";

/* ---------- events ---------- */
document.getElementById("pane").addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.f){
    set(t.dataset.f, t.type==="checkbox" ? t.checked : t.value);
    if(t.dataset.rerender){ state.machine.model = (PRINTERS[state.machine.brand]||[""])[0]; render(); return; }
    renderReport();
  }
  if(t.dataset.part){
    state.parts[+t.dataset.i][t.dataset.part] = t.value;
    renderReport();
  }
});
document.getElementById("pane").addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset.multi){
    const arr = state[t.dataset.multi];
    const i = arr.indexOf(t.value);
    if(t.checked && i<0) arr.push(t.value);
    if(!t.checked && i>=0) arr.splice(i,1);
    // update the counter in place so the pane keeps its scroll position
    const h = t.closest(".stage").querySelector("small");
    if(h){
      const custom = t.dataset.multi === "symptoms" ? state.symptomsCustom
                   : t.dataset.multi === "work" ? state.workCustom : state.verifyCustom;
      h.textContent = (arr.length + custom.length) + " selected";
    }
    renderReport();
  }
});
document.getElementById("pane").addEventListener("click", e=>{
  const t = e.target;
  if(t.id === "addPart"){ state.parts.push({name:"",qty:"1",price:""}); render(); return; }
  if(t.dataset.delpart !== undefined){ state.parts.splice(+t.dataset.delpart,1); render(); return; }
  if(t.dataset.addbtn){ addCustom(t.dataset.addbtn); return; }
  if(t.dataset.delcustom){ state[t.dataset.delcustom].splice(+t.dataset.i,1); render(); return; }
});
document.getElementById("pane").addEventListener("keydown", e=>{
  if(e.key === "Enter" && e.target.dataset.addinput){ e.preventDefault(); addCustom(e.target.dataset.addinput); }
});
function addCustom(key){
  const input = document.querySelector('[data-addinput="'+key+'"]');
  const v = input && input.value.trim();
  if(!v) return;
  state[key].push(v);
  render();
  const again = document.querySelector('[data-addinput="'+key+'"]');
  if(again) again.focus();
}

document.getElementById("btnPrint").addEventListener("click", ()=>window.print());
document.getElementById("btnNew").addEventListener("click", ()=>{
  const shop = state.shop, terms = state.job.terms, cur = state.job.currency, rate = state.job.labourRate;
  state = blank();
  state.shop = shop; state.job.terms = terms; state.job.currency = cur; state.job.labourRate = rate;
  state.job.ref = nextRef();
  render();
});

document.getElementById("btnSave").addEventListener("click", async ()=>{
  store.shop = state.shop;
  if(!state.id){
    state.id = "j"+Date.now();
    store.seq = Math.max(store.seq, refSeq(state.job.ref)+1);
  }
  const idx = store.jobs.findIndex(j=>j.id===state.id);
  const copy = JSON.parse(JSON.stringify(state));
  if(idx>=0) store.jobs[idx] = copy; else store.jobs.unshift(copy);
  const ok = await saveStore();
  toast(ok ? "Job saved." : "Saved for this session only — storage is unavailable here.");
});

const dlg = document.getElementById("dlg");
document.getElementById("btnSaved").addEventListener("click", ()=>{ renderSaved(); dlg.showModal(); });
document.getElementById("dlgClose").addEventListener("click", ()=>dlg.close());
function renderSaved(){
  const l = document.getElementById("dlgList");
  if(!store.jobs.length){ l.innerHTML = '<div class="row"><div class="t">No saved jobs yet. Fill in a job and choose “Save job”.</div></div>'; return; }
  l.innerHTML = store.jobs.map(j=>`
    <div class="row">
      <div class="t">${esc(j.job.ref||"(no ref)")} — ${esc(j.cust.name||"unnamed customer")}
        <span>${esc(j.machine.brand)} ${esc(j.machine.model)} · ${esc(j.job.date)} · ${esc(j.job.status)}</span></div>
      <button class="mini" data-load="${j.id}">Open</button>
      <button class="mini" data-del="${j.id}">Delete</button>
    </div>`).join("");
}
document.getElementById("dlgList").addEventListener("click", async e=>{
  const id = e.target.dataset.load || e.target.dataset.del;
  if(!id) return;
  if(e.target.dataset.load){
    state = JSON.parse(JSON.stringify(store.jobs.find(j=>j.id===id)));
    state.shop.name = SHOP_NAME; state.shop.contact = SHOP_CONTACT;
    render(); dlg.close(); toast("Job opened.");
  } else {
    store.jobs = store.jobs.filter(j=>j.id!==id);
    await saveStore(); renderSaved();
  }
});

document.getElementById("tabForm").addEventListener("click", ()=>switchTab(true));
document.getElementById("tabPrev").addEventListener("click", ()=>switchTab(false));
function switchTab(form){
  document.body.classList.toggle("show-form", form);
  document.body.classList.toggle("show-preview", !form);
  document.getElementById("tabForm").setAttribute("aria-pressed", form);
  document.getElementById("tabPrev").setAttribute("aria-pressed", !form);
}

let toastT;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("show"), 2600);
}

function refSeq(ref){ const m = /(\d+)$/.exec(ref||""); return m ? +m[1] : 0; }
function nextRef(){
  const d = new Date();
  return "LBL-JR-MDR-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"-"+pad(store.seq);
}

/* ---------- PDF export ---------- */
const PDF_LIB = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
function loadJsPDF(){
  if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  return new Promise((res,rej)=>{
    const el = document.createElement("script");
    el.src = PDF_LIB;
    el.onload = ()=> (window.jspdf && window.jspdf.jsPDF) ? res(window.jspdf.jsPDF) : rej();
    el.onerror = rej;
    document.head.appendChild(el);
  });
}

async function downloadPdf(){
  let jsPDF;
  try{ jsPDF = await loadJsPDF(); }
  catch(e){
    toast("PDF library unavailable offline — opening the print dialog, choose Save as PDF.");
    setTimeout(()=>window.print(), 1200);
    return;
  }

  const s = state, cur = s.job.currency || "$";
  const st = STATUS.find(x=>x[0]===s.job.status) || STATUS[0];
  const hrs = parseFloat(s.job.labourHours)||0, rate = parseFloat(s.job.labourRate)||0;
  const labour = hrs*rate;
  const partRows = s.parts.filter(p=>p.name);
  const partsTotal = partRows.reduce((t,p)=>t+(parseFloat(p.qty)||0)*(parseFloat(p.price)||0),0);
  const dateStr = s.job.date ? new Date(s.job.date+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}) : "";

  const doc = new jsPDF({unit:"mm", format:"a4"});
  const M=15, W=210, R=W-M, CW=W-2*M, BOT=297-20;
  const GREEN=[165,205,103], GDEEP=[110,155,51], INK=[43,46,49], MID=[84,89,95], MUTED=[138,144,153], RULE=[217,220,214];
  let y = M;

  const lh = pt => pt*0.3528*1.34;
  function ensure(h){ if(y+h > BOT){ doc.addPage(); y = M; } }
  function para(text, o){
    o = o||{};
    const size = o.size||10.5, w = o.w||CW, x = o.x||M;
    doc.setFont(o.font||"times", o.style||"normal");
    doc.setFontSize(size);
    doc.setTextColor.apply(doc, o.color||INK);
    for(const ln of doc.splitTextToSize(String(text||""), w)){
      ensure(lh(size)); doc.text(ln, x, y+lh(size)-1.3); y += lh(size);
    }
  }
  function head(n, title){
    ensure(12); y += 4;
    doc.setFont("helvetica","bold"); doc.setFontSize(8.6);
    doc.setTextColor.apply(doc, GDEEP); doc.text(String(n), M, y);
    doc.setTextColor.apply(doc, INK);   doc.text(title, M+5, y);
    y += 1.8;
    doc.setDrawColor.apply(doc, RULE); doc.setLineWidth(0.2); doc.line(M, y, R, y);
    y += 3.4;
  }
  function bullets(items){
    if(!items.length){ para("None recorded.", {style:"italic", color:MUTED, size:10}); return; }
    for(const it of items){
      doc.setFont("times","normal"); doc.setFontSize(10.5); doc.setTextColor.apply(doc, INK);
      const lines = doc.splitTextToSize(String(it), CW-6);
      lines.forEach((ln,i)=>{
        ensure(5);
        if(i===0){ doc.setFillColor.apply(doc, GREEN); doc.circle(M+1.5, y+1.6, 1, "F"); }
        doc.setFont("times","normal"); doc.setFontSize(10.5); doc.setTextColor.apply(doc, INK);
        doc.text(ln, M+5.5, y+2.7); y += 4.7;
      });
    }
  }
  function kv(pairs, x, w){
    for(const [k,v] of pairs){
      const lines = doc.splitTextToSize(String(v||"—"), w-26);
      ensure(4.6*lines.length);
      doc.setFont("helvetica","normal"); doc.setFontSize(8.4); doc.setTextColor.apply(doc, MUTED);
      doc.text(k, x, y+3.1);
      doc.setFont("times","normal"); doc.setFontSize(10); doc.setTextColor.apply(doc, INK);
      lines.forEach((ln,i)=> doc.text(ln, x+24, y+3.1+i*4.2));
      y += 4.4 + (lines.length-1)*4.2;
    }
  }

  /* header */
  const logoH = 23;
  doc.addImage(LOGO, "PNG", M, y, logoH*LOGO_RATIO, logoH);
  const tx = M + logoH*LOGO_RATIO + 6;
  doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.setTextColor.apply(doc, INK);
  doc.text(s.shop.name||"Layer by Layer", tx, y+7);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.6); doc.setTextColor.apply(doc, MID);
  doc.splitTextToSize(s.shop.contact||"", 70).slice(0,4).forEach((ln,i)=> doc.text(ln, tx, y+12+i*4));

  doc.setFont("helvetica","bold"); doc.setFontSize(8.4); doc.setTextColor.apply(doc, GDEEP);
  doc.text("Maintenance, diagnosis & repair", R, y+6, {align:"right"});
  doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.setTextColor.apply(doc, INK);
  doc.text(s.job.ref||"—", R, y+13, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor.apply(doc, MID);
  doc.text(dateStr, R, y+18, {align:"right"});

  y += logoH + 4;
  doc.setFillColor.apply(doc, GREEN); doc.rect(M, y, CW, 1.4, "F");
  doc.setFillColor.apply(doc, RULE);  doc.rect(M, y+2.1, CW, 0.7, "F");
  doc.setFillColor(231,233,227);      doc.rect(M, y+3.7, CW, 0.4, "F");
  y += 9;

  /* status stamp */
  const stampColor = st[1]==="ok" ? [94,143,42] : st[1]==="bad" ? INK : MID;
  doc.setFont("helvetica","bold"); doc.setFontSize(10);
  const label = st[0].toUpperCase();
  const sw = doc.getTextWidth(label) + 9;
  doc.setDrawColor.apply(doc, stampColor); doc.setLineWidth(0.7);
  doc.roundedRect(R-sw, y, sw, 8, 1, 1);
  doc.setTextColor.apply(doc, stampColor);
  doc.text(label, R-sw/2, y+5.4, {align:"center"});
  y += 13;

  /* facts, two columns */
  const colW = (CW-10)/2, yStart = y;
  doc.setDrawColor.apply(doc, INK); doc.setLineWidth(0.5);
  doc.line(M, y, M+colW, y); doc.line(M+colW+10, y, R, y);
  y += 4;
  doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor.apply(doc, MID);
  doc.text("CUSTOMER", M, y); doc.text("MACHINE", M+colW+10, y);
  y += 3;
  const factTop = y;
  kv([["Name",s.cust.name],["Phone",s.cust.phone],["Email",s.cust.email]], M, colW);
  const leftEnd = y; y = factTop;
  const machine = [["Printer",(s.machine.brand||"")+" "+(s.machine.model||"")],["Serial",s.machine.serial],
                   ["Nozzle",s.machine.nozzle],["Plate",s.machine.plate],["Filament",s.machine.filament]];
  if(s.machine.usage) machine.push(["Usage",s.machine.usage]);
  kv(machine, M+colW+10, colW);
  y = Math.max(leftEnd, y) + 2;

  /* sections */
  let n = 1;
  if(s.cust.intake){ head(n++, "Reported by customer"); para(s.cust.intake, {color:MID}); }
  head(n++, "Symptoms observed");
  bullets(s.symptoms.concat(s.symptomsCustom));
  if(s.symptomNotes) para(s.symptomNotes, {color:MID});
  head(n++, "Diagnosis");
  s.findings ? para(s.findings) : para("Not recorded.", {style:"italic", color:MUTED, size:10});
  head(n++, "Work performed");
  bullets(s.work.concat(s.workCustom));
  if(s.workNotes) para(s.workNotes, {color:MID});
  if(partRows.length){
    y += 2;
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor.apply(doc, MID);
    ensure(6); doc.text("PARTS FITTED", M, y+3); doc.text("QTY", R, y+3, {align:"right"}); y += 5;
    doc.setDrawColor.apply(doc, RULE); doc.setLineWidth(0.2); doc.line(M, y, R, y); y += 1;
    for(const p of partRows){
      ensure(5.4);
      doc.setFont("times","normal"); doc.setFontSize(10); doc.setTextColor.apply(doc, INK);
      doc.text(String(p.name), M, y+3.6);
      doc.text(String(p.qty||1), R, y+3.6, {align:"right"});
      y += 5.2;
      doc.setDrawColor(231,233,227); doc.line(M, y-1, R, y-1);
    }
  }
  head(n++, "Verification");
  bullets(s.verify.concat(s.verifyCustom));
  if(s.verifyNotes) para(s.verifyNotes, {color:MID});
  if(s.advice){ head(n++, "Recommendations"); para(s.advice); }

  /* charges */
  if(s.job.showCharges && (labour>0 || partsTotal>0)){
    head(n++, "Charges");
    const cQty = R-58, cUnit = R-30, cAmt = R;
    doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor.apply(doc, MID);
    ensure(6);
    doc.text("ITEM", M, y+3); doc.text("QTY", cQty, y+3, {align:"right"});
    doc.text("UNIT", cUnit, y+3, {align:"right"}); doc.text("AMOUNT", cAmt, y+3, {align:"right"});
    y += 5; doc.setDrawColor.apply(doc, RULE); doc.line(M, y, R, y); y += 1;
    const rows = [];
    if(labour>0) rows.push(["Labour — service and repair", hrs+" h", money(rate,cur), money(labour,cur)]);
    for(const p of partRows){
      const q = parseFloat(p.qty)||0, u = parseFloat(p.price)||0;
      rows.push([p.name, q?String(q):"", u?money(u,cur):"", money(q*u,cur)]);
    }
    for(const r of rows){
      ensure(5.4);
      doc.setFont("times","normal"); doc.setFontSize(10); doc.setTextColor.apply(doc, INK);
      doc.text(String(r[0]), M, y+3.6, {maxWidth:CW-62});
      doc.text(r[1], cQty, y+3.6, {align:"right"});
      doc.text(r[2], cUnit, y+3.6, {align:"right"});
      doc.text(r[3], cAmt, y+3.6, {align:"right"});
      y += 5.2; doc.setDrawColor(231,233,227); doc.line(M, y-1, R, y-1);
    }
    ensure(8); y += 1.5;
    doc.setDrawColor.apply(doc, INK); doc.setLineWidth(0.4); doc.line(M, y, R, y); y += 1;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor.apply(doc, INK);
    doc.text("Total", M, y+4); doc.text(money(labour+partsTotal,cur), cAmt, y+4, {align:"right"});
    y += 7;
  }

  /* sign-off */
  ensure(24); y += 10;
  const sw2 = (CW-14)/2;
  doc.setDrawColor.apply(doc, INK); doc.setLineWidth(0.3);
  doc.line(M, y, M+sw2, y); doc.line(M+sw2+14, y, R, y);
  doc.setFont("times","normal"); doc.setFontSize(10.5); doc.setTextColor.apply(doc, INK);
  if(s.shop.tech) doc.text(s.shop.tech, M, y-2);
  if(s.cust.name) doc.text(s.cust.name, M+sw2+14, y-2);
  doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor.apply(doc, MID);
  doc.text("Technician — "+(s.shop.name||"Layer by Layer"), M, y+3.6);
  doc.text("Received in working order — signature & date", M+sw2+14, y+3.6);
  y += 10;

  if(s.job.terms){
    ensure(14);
    doc.setDrawColor.apply(doc, RULE); doc.setLineWidth(0.2); doc.line(M, y, R, y); y += 3;
    para(s.job.terms, {font:"helvetica", size:7.6, color:MID});
  }

  /* footers */
  const pages = doc.getNumberOfPages();
  for(let i=1; i<=pages; i++){
    doc.setPage(i);
    doc.setFillColor.apply(doc, GREEN); doc.rect(M, 285, CW, 0.8, "F");
    doc.setFont("helvetica","normal"); doc.setFontSize(7.6); doc.setTextColor.apply(doc, MUTED);
    doc.text((s.shop.name||"Layer by Layer")+" — "+(s.job.ref||""), M, 290);
    doc.text("Page "+i+" of "+pages, R, 290, {align:"right"});
  }

  const safe = t => String(t||"").replace(/[^A-Za-z0-9-_]+/g,"-").replace(/^-|-$/g,"");
  doc.save([safe(s.job.ref)||"MDR-report", safe(s.cust.name)].filter(Boolean).join("_")+".pdf");
}

document.getElementById("btnPdf").addEventListener("click", async e=>{
  const b = e.target; const t = b.textContent;
  b.disabled = true; b.textContent = "Building PDF…";
  try{ await downloadPdf(); }
  catch(err){ console.error(err); toast("PDF build failed — opening the print dialog instead."); setTimeout(()=>window.print(), 1200); }
  finally { b.disabled = false; b.textContent = t; }
});

/* ---------- boot ---------- */
(async function(){
  document.getElementById("barLogo").src = LOGO;
  await loadStore();
  state.shop.tech = (store.shop||{}).tech || "";
  state.job.ref = nextRef();
  render();
})();
</script>
